plugins {
    id 'com.android.application'
}

android {
    namespace 'com.smart.suitcase'
    compileSdk 35

    defaultConfig {
        applicationId 'com.smart.suitcase'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.4'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // The requested brand icon intentionally uses a full black square field.
        disable 'IconLauncherShape'
    }
}
