<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <script>
    if (new URLSearchParams(location.search).get('theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }
  </script>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;touch-action:none}
    canvas{display:block;width:100%;height:100%;touch-action:none}
    #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#59636e;font:600 15px sans-serif;background:#fff;z-index:2}
    html.dark,html.dark body{background:#0f1115}
    html.dark #loading{color:#a7b0bc;background:#0f1115}
  </style>
</head>
<body>
<div id="loading">3D 模型加载中</div>
<script src="three.min.js"></script>
<script>
(() => {
  const loading = document.getElementById('loading');
  const darkMode = document.documentElement.classList.contains('dark');
  try {
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(darkMode ? 0x0f1115 : 0xffffff);

    // Fixed 45-degree overhead product view.
    const camera = new THREE.PerspectiveCamera(31, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(11.35, 10.45, 11.35);
    camera.lookAt(0, 0.55, 0);

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({
        antialias:true, alpha:false, powerPreference:'high-performance'
      });
    } catch (primaryError) {
      console.warn('High-performance WebGL unavailable, using compatibility mode', primaryError);
      renderer = new THREE.WebGLRenderer({
        antialias:false, alpha:false, powerPreference:'default',
        precision:'mediump'
      });
    }
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    document.body.appendChild(renderer.domElement);
    renderer.domElement.addEventListener('webglcontextlost', event => {
      event.preventDefault();
      renderer.domElement.dataset.modelReady = '0';
      loading.textContent = '3D 模型正在恢复';
      loading.style.display = 'flex';
      setTimeout(() => location.reload(), 300);
    });

    scene.add(new THREE.HemisphereLight(0xffffff, 0xc7cbd0, 2.5));
    const key = new THREE.DirectionalLight(0xffffff, 3.2);
    key.position.set(6, 10, 8);
    key.castShadow = true;
    key.shadow.mapSize.set(512, 512);
    key.shadow.camera.left = -7;
    key.shadow.camera.right = 7;
    key.shadow.camera.top = 9;
    key.shadow.camera.bottom = -6;
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xe7efff, 1.15);
    fill.position.set(-6, 4, -5);
    scene.add(fill);

    const mat = {
      case: new THREE.MeshStandardMaterial({color:0xb9bec1, metalness:0.63, roughness:0.34}),
      panel: new THREE.MeshStandardMaterial({color:0xc8cbcd, metalness:0.48, roughness:0.43}),
      edge: new THREE.MeshStandardMaterial({color:0xe4e6e7, metalness:0.92, roughness:0.17}),
      hinge: new THREE.MeshStandardMaterial({color:0xd5d7d8, metalness:0.95, roughness:0.2}),
      black: new THREE.MeshStandardMaterial({color:0x16181a, metalness:0.1, roughness:0.55}),
      rubber: new THREE.MeshStandardMaterial({color:0x101214, metalness:0, roughness:0.88}),
      blue: new THREE.MeshStandardMaterial({color:0x075ebc, metalness:0.62, roughness:0.27}),
      red: new THREE.MeshStandardMaterial({color:0xb51c22, metalness:0.1, roughness:0.42}),
      seam: new THREE.MeshStandardMaterial({color:0x111315, emissive:0x030404, metalness:0, roughness:0.92}),
      darkGlass: new THREE.MeshStandardMaterial({color:0x20262b, metalness:0.25, roughness:0.3})
    };

    const suitcase = new THREE.Group();
    scene.add(suitcase);

    function mesh(geometry, material, x, y, z, parent=suitcase) {
      const item = new THREE.Mesh(geometry, material);
      item.position.set(x, y, z);
      item.castShadow = true;
      item.receiveShadow = true;
      parent.add(item);
      return item;
    }
    function box(w,h,d,material,x,y,z,parent=suitcase) {
      return mesh(new THREE.BoxGeometry(w,h,d), material, x,y,z,parent);
    }
    function cylinder(r,length,material,x,y,z,axis='y',segments=36,parent=suitcase) {
      const item = mesh(new THREE.CylinderGeometry(r,r,length,segments), material, x,y,z,parent);
      if (axis === 'x') item.rotation.z = Math.PI / 2;
      if (axis === 'z') item.rotation.x = Math.PI / 2;
      return item;
    }
    function bevelBox(w,h,d,r,material,x,y,z,parent=suitcase) {
      const shape = new THREE.Shape();
      const left=-w/2, bottom=-h/2;
      shape.moveTo(left+r,bottom);
      shape.lineTo(left+w-r,bottom);
      shape.quadraticCurveTo(left+w,bottom,left+w,bottom+r);
      shape.lineTo(left+w,bottom+h-r);
      shape.quadraticCurveTo(left+w,bottom+h,left+w-r,bottom+h);
      shape.lineTo(left+r,bottom+h);
      shape.quadraticCurveTo(left,bottom+h,left,bottom+h-r);
      shape.lineTo(left,bottom+r);
      shape.quadraticCurveTo(left,bottom,left+r,bottom);
      const geometry = new THREE.ExtrudeGeometry(shape, {
        depth:d, bevelEnabled:true, bevelSegments:2, steps:1,
        bevelSize:Math.min(.045,r*.35), bevelThickness:.045, curveSegments:6
      });
      geometry.center();
      return mesh(geometry,material,x,y,z,parent);
    }

    // Square aluminum equipment case, matching the photographed prototype.
    bevelBox(3.55,4.55,2.18,.10,mat.case,0,.02,0);
    bevelBox(3.28,4.25,.10,.055,mat.panel,0,.02,1.13);
    bevelBox(3.28,4.25,.08,.055,mat.panel,0,.02,-1.13);

    // Aluminum frame profiles and corner caps.
    [-1.72,1.72].forEach(x => {
      box(.11,4.25,.14,mat.edge,x,.02,-1.14);
      box(.14,4.25,.11,mat.edge,x,.02,0);
    });
    [-2.10,2.14].forEach(y => {
      box(3.34,.11,.14,mat.edge,0,y,-1.14);
      box(3.48,.14,.11,mat.edge,0,y,0);
    });
    [-1.72,1.72].forEach(x => [-2.10,2.14].forEach(y => {
      // Compact corner protectors: all three dimensions are about 2/3 size.
      bevelBox(.25,.25,.20,.037,mat.hinge,x,y,1.13);
      bevelBox(.25,.25,.17,.037,mat.hinge,x,y,-1.13);
    }));

    // Two equal silver rails with a thin black opening seam between them.
    // The side strips align with the latch centers; the top run is lifted onto
    // the case surface so the lid boundary remains visible from above.
    [-1.80,1.80].forEach(x => {
      box(.08,4.55,.08,mat.edge,x,.02,.92);
      box(.08,4.55,.04,mat.seam,x,.02,.86);
      box(.08,4.55,.08,mat.edge,x,.02,.80);
    });
    box(3.64,.06,.08,mat.edge,0,2.32,.92);
    box(3.64,.06,.04,mat.seam,0,2.32,.86);
    box(3.64,.06,.08,mat.edge,0,2.32,.80);

    // Continue the same boundary around the lower edge of the lid.
    box(3.64,.08,.08,mat.edge,0,-2.10,.92);
    box(3.64,.08,.04,mat.seam,0,-2.10,.86);
    box(3.64,.08,.08,mat.edge,0,-2.10,.80);

    // Rear-mounted pull handle. Every moving rail sits behind the rear panel
    // instead of emerging through the suitcase body.
    const rearRailZ = -1.38;
    const rearMountZ = -1.38;
    [-.69,.69].forEach(x => {
      box(.15,2.70,.15,mat.edge,x,3.42,rearRailZ);
      box(.23,2.45,.24,mat.black,x,.84,rearMountZ);
    });
    bevelBox(1.68,.34,.34,.11,mat.black,0,4.78,rearRailZ);
    box(1.66,.25,.27,mat.black,0,1.66,rearMountZ);
    box(1.66,.25,.27,mat.black,0,-.30,rearMountZ);

    // Fold-down top handle.
    box(1.15,.17,.25,mat.black,0,2.43,-.12);
    box(.18,.25,.24,mat.black,-.48,2.31,-.12);
    box(.18,.25,.24,mat.black,.48,2.31,-.12);

    // The +X side carries the two lid latches and the centered side handle.
    [1.28,-1.38].forEach(y => {
      box(.16,.43,.66,mat.hinge,1.84,y,.82);
      bevelBox(.25,.20,.34,.035,mat.hinge,1.95,y,.86);
      cylinder(.055,.21,mat.black,2.02,y,.92,'x',20);
    });
    box(.17,.27,.48,mat.hinge,1.84,.57,.02);
    box(.17,.27,.48,mat.hinge,1.84,-.57,.02);
    bevelBox(.18,.78,.25,.06,mat.black,1.96,0,.02);

    // The -X side carries the lid hinges and the low-mounted power switch.
    [1.28,-1.38].forEach(y => {
      box(.16,.43,.66,mat.hinge,-1.84,y,.82);
      cylinder(.085,.48,mat.hinge,-1.96,y,.86,'y',24);
    });
    box(.15,.43,.38,mat.black,-1.86,-1.08,.02);
    bevelBox(.11,.27,.25,.025,mat.red,-1.96,-1.08,.02);

    // The power socket is low on the switch side. The two ultrasonic sensors
    // are represented by vertical black bars near the lower rear corners.
    cylinder(.105,.11,mat.darkGlass,-1.91,-1.50,-.16,'x',24);
    [-1.92,1.92].forEach(x => {
      bevelBox(.13,.48,.18,.035,mat.black,x,-1.44,-.91);
    });

    // Each powered wheel is carried by a motor housing and axle below the case.
    [-1.98,1.98].forEach(x => {
      const motorX = x < 0 ? -1.68 : 1.68;
      cylinder(.25,.34,mat.black,motorX,-2.03,.66,'x',32);
      cylinder(.10,.48,mat.hinge,x,-2.25,.66,'x',24);
      cylinder(.56,.28,mat.rubber,x,-2.25,.66,'x',40);
      cylinder(.39,.30,mat.blue,x,-2.25,.66,'x',32);
      cylinder(.105,.32,mat.hinge,x,-2.25,.66,'x',24);
    });

    // Rear swivel casters: a vertical swivel stem feeds a metal U-fork. Two
    // fork plates clamp each wheel and a visible axle passes through all three.
    [-1.54,1.54].forEach(x => {
      cylinder(.10,.18,mat.hinge,x,-2.18,-1.22,'y',24);
      box(.44,.08,.22,mat.hinge,x,-2.29,-1.22);
      box(.06,.34,.12,mat.hinge,x-.16,-2.45,-1.22);
      box(.06,.34,.12,mat.hinge,x+.16,-2.45,-1.22);
      cylinder(.27,.24,mat.rubber,x,-2.54,-1.22,'x',28);
      cylinder(.07,.48,mat.hinge,x,-2.54,-1.22,'x',20);
      cylinder(.10,.035,mat.hinge,x-.25,-2.54,-1.22,'x',20);
      cylinder(.10,.035,mat.hinge,x+.25,-2.54,-1.22,'x',20);
    });
    cylinder(.25,.32,mat.black,0,-2.56,-.02,'y',36);
    cylinder(.19,.335,mat.darkGlass,0,-2.56,-.02,'y',36);

    // Stationary turntable below the model.
    const turntable = new THREE.Group();
    scene.add(turntable);
    const disk = mesh(new THREE.CylinderGeometry(3.15,3.28,.18,64),
      new THREE.MeshStandardMaterial({
        color:darkMode ? 0x242a31 : 0xe8eaec,metalness:.12,roughness:.68
      }),
      0,-2.90,0,turntable);
    disk.castShadow = false;
    const ring = mesh(new THREE.TorusGeometry(2.82,.035,12,80),
      new THREE.MeshStandardMaterial({
        color:darkMode ? 0x59636f : 0xb8bec4,metalness:.48,roughness:.42
      }),
      0,-2.795,0,turntable);
    ring.rotation.x = Math.PI / 2;

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(7.2,64),
      new THREE.MeshStandardMaterial({color:darkMode ? 0x15191f : 0xf7f8f9,roughness:1})
    );
    floor.rotation.x = -Math.PI/2;
    floor.position.y = -3.00;
    floor.receiveShadow = true;
    scene.add(floor);

    // Horizontal drag only: the camera angle stays fixed and the case rotates on the disk.
    let targetYaw = 0;
    let dragging = false;
    let lastX = 0;
    let touched = false;
    renderer.domElement.addEventListener('pointerdown', event => {
      dragging = true;
      touched = true;
      lastX = event.clientX;
      renderer.domElement.setPointerCapture(event.pointerId);
    });
    renderer.domElement.addEventListener('pointermove', event => {
      if (!dragging) return;
      targetYaw += (event.clientX - lastX) * .012;
      lastX = event.clientX;
    });
    renderer.domElement.addEventListener('pointerup', () => dragging = false);
    renderer.domElement.addEventListener('pointercancel', () => dragging = false);

    const frameBounds = new THREE.Box3().setFromObject(suitcase);
    frameBounds.union(new THREE.Box3().setFromObject(turntable));
    const frameCenter = frameBounds.getCenter(new THREE.Vector3());
    const frameSize = frameBounds.getSize(new THREE.Vector3());
    const viewDirection = new THREE.Vector3(1, .92, 1).normalize();

    function resize() {
      camera.aspect = innerWidth / innerHeight;
      const verticalFov = THREE.MathUtils.degToRad(camera.fov);
      const horizontalFov = 2 * Math.atan(Math.tan(verticalFov / 2) * camera.aspect);
      const verticalDistance = frameSize.y / (2 * Math.tan(verticalFov / 2));
      const horizontalDistance = Math.max(frameSize.x, frameSize.z) /
        (2 * Math.tan(horizontalFov / 2));
      const distance = Math.max(verticalDistance, horizontalDistance) * 1.12;
      camera.position.copy(frameCenter).addScaledVector(viewDirection, distance);
      camera.lookAt(frameCenter);
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight, false);
    }
    addEventListener('resize', resize);
    resize();

    const clock = new THREE.Clock();
    let firstFrame = true;
    function render() {
      requestAnimationFrame(render);
      const dt = Math.min(clock.getDelta(), .04);
      if (!touched) targetYaw += dt * .035;
      suitcase.rotation.y += (targetYaw - suitcase.rotation.y) * .10;
      renderer.render(scene,camera);
      if (firstFrame) {
        firstFrame = false;
        renderer.domElement.dataset.modelReady = '1';
        loading.style.display = 'none';
      }
    }
    render();
  } catch (error) {
    console.error(error && error.stack ? error.stack : error);
    loading.textContent = '3D 模型渲染失败，请更新 Android System WebView';
    loading.style.color = '#b21720';
  }
})();
</script>
</body>
</html>
